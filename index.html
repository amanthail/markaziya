<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>دليل المجمع التجاري</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
/* Layout: full-screen 3D kiosk map; brand top-start, clock top-end, search + category rail docked bottom, place card floating. Single light look by choice (kiosk map). */
:root{
  --ground:#eceeee; --paper:#ffffff; --ink:#1f2a33; --muted:#6c7780;
  --line:#dfe3e5; --accent:#1d5c74; --accent-soft:#e3eef2; --stone:#efe6d8;
  --shadow:0 6px 24px rgba(31,42,51,.14);
  --f-body:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-brand:"Almarai",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scene{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-right,0px));
  background:var(--paper);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow);z-index:5;line-height:1.2}
html[dir=ltr] .brand{inset-inline-start:max(16px,env(safe-area-inset-left,0px))}
.brand b{font-family:var(--f-brand);font-weight:800;font-size:19px;display:block;color:var(--accent)}
.brand small{font-size:11px;color:var(--muted)}
.tab{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);background:rgba(85,92,98,.78);color:#fff;
  padding:8px 26px 10px;border-radius:0 0 10px 10px;font-size:13px;z-index:5;white-space:nowrap}
.clock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow);z-index:5;font-variant-numeric:tabular-nums}
.tod{position:fixed;top:calc(54px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px));z-index:5;width:36px;height:36px;border:0;border-radius:8px;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center}
.tod svg{width:18px;height:18px;color:var(--accent)}
.tod[aria-pressed=true]{background:var(--accent)}.tod[aria-pressed=true] svg{color:#fff}
html[dir=ltr] .tod{inset-inline-end:max(16px,env(safe-area-inset-right,0px))}
.dot.logo{background:#fff;overflow:hidden;padding:0}.dot.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.biglogo{width:64px;height:64px;border-radius:50%;background:#fff;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}.biglogo img{width:100%;height:100%;object-fit:cover;display:block}
.card h2 .desc{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.search input{padding-inline-end:96px}
.me{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:5px;display:flex;align-items:center;gap:5px;border:0;border-radius:6px;background:var(--accent);color:#fff;padding:6px 10px;font-size:12.5px;font-weight:600}
.me svg{width:15px;height:15px;position:static;transform:none;flex:none}
.me.set{background:var(--accent-soft);color:var(--accent)}
.startp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));background:var(--paper);border-radius:12px;box-shadow:var(--shadow);z-index:8;padding:14px;max-height:58vh;overflow:auto;box-sizing:border-box}
.startp h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.startp h3 button{border:0;background:var(--ground);width:28px;height:28px;border-radius:50%}
.startp .opt{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:8px;text-align:start;font-weight:600;font-size:13.5px}
.startp .opt small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.startp .opt svg{width:20px;height:20px;color:var(--accent);flex:none}
.startp p{margin:6px 0 8px;font-size:12px;color:var(--muted)}
.startp .chips{display:flex;flex-wrap:wrap;gap:6px}
.startp .chip{border:1px solid var(--line);background:var(--ground);border-radius:16px;padding:6px 11px;font-size:12.5px}
.startp .chip:hover,.startp .opt:hover{border-color:var(--accent)}

.demo{display:inline-block;margin-top:4px;font-size:10px;background:#fff4dc;color:#7a5410;border-radius:4px;padding:1px 6px}

/* markers */
#markers{position:fixed;inset:0;pointer-events:none;z-index:2}
.mk{position:absolute;left:0;top:0;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;pointer-events:auto;
  background:none;border:0;padding:0 0 9px;transform-origin:50% 100%;transition:opacity .25s;will-change:transform}
.mk::after{content:"";position:absolute;bottom:0;left:50%;width:0;height:0;margin-left:-6px;border:6px solid transparent;border-top:9px solid #fff;border-bottom:0;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.mk.small .dot{width:22px;height:22px}.mk.small .dot svg{width:12px;height:12px}
.mk .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk .dot svg{width:17px;height:17px}
.mk .lb{font-size:11.5px;font-weight:500;color:#4d5257;background:none;padding:0 2px;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff,0 0 1px #fff}
.mk.dim{opacity:.18}
.mk.sel .dot{width:40px;height:40px;box-shadow:0 0 0 6px rgba(29,92,116,.25),0 2px 6px rgba(0,0,0,.3)}
.mk.here .dot{background:var(--accent)}
.mk.here .dot::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);animation:ping 1.8s infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.mk.here .dot::after{animation:none}}

/* bottom dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 140px));z-index:6;display:flex;flex-direction:column;gap:6px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 38px 10px 12px;font:inherit;font-size:14px;box-shadow:var(--shadow)}
html[dir=ltr] .search input{padding:10px 12px 10px 38px}
.search > svg{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;bottom:calc(100% + 6px);inset-inline:0;background:var(--paper);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:4px}
.results button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:6px;text-align:start}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.results .dot svg{width:14px;height:14px}
.results small{color:var(--muted);display:block;font-size:11px}
.rail{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:10px;padding:8px 4px;box-shadow:var(--shadow)}
.rail .arrow{border:0;background:none;width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center}
.rail .arrow:hover{background:var(--accent-soft)}
.rail .arrow svg{width:16px;height:16px}
html[dir=ltr] .rail .arrow svg{transform:scaleX(-1)}
.cats{display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:72px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border-radius:8px}
.cat .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.cat .dot svg{width:20px;height:20px}
.cat span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cat[aria-pressed=true]{background:var(--accent-soft)}
.cat[aria-pressed=true] span{font-weight:600;color:var(--accent)}

.corner{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--paper);border:0;border-radius:10px;
  width:54px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;box-shadow:var(--shadow)}
.corner svg{width:20px;height:20px;color:var(--accent)}
#homeBtn{inset-inline-start:max(16px,env(safe-area-inset-right,0px))}
#langBtn{inset-inline-end:max(16px,env(safe-area-inset-left,0px))}
html[dir=ltr] #homeBtn{inset-inline-start:max(16px,env(safe-area-inset-left,0px))}
html[dir=ltr] #langBtn{inset-inline-end:max(16px,env(safe-area-inset-right,0px))}

/* place card */
.card{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));inset-inline-start:max(16px,env(safe-area-inset-right,0px));width:300px;max-width:calc(100% - 32px);
  background:var(--paper);border-radius:12px;box-shadow:var(--shadow);z-index:7;overflow:hidden}
html[dir=ltr] .card{inset-inline-start:max(16px,env(safe-area-inset-left,0px))}
.card .hd{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 8px}
.card h2{font-size:17px;margin:0;flex:1;text-wrap:balance}
.card .ic{border:0;background:var(--ground);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.card .ic svg{width:15px;height:15px}
.card .acts{display:flex;gap:8px;padding:0 14px 12px}
.card .acts button{flex:1;border-radius:8px;padding:8px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.btn-pri{background:var(--accent);color:#fff;border:0}
.btn-sec{background:var(--paper);border:1px solid var(--line)}
.card dl{margin:0;padding:0 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .swatch{height:84px;display:grid;place-items:center;color:#fff}
.card .swatch svg{width:36px;height:36px;opacity:.9}
.steps{margin:0;padding:10px 14px 14px;border-top:1px solid var(--line);font-size:13px;display:grid;gap:6px;list-style:none;counter-reset:s}
.steps li{display:flex;gap:8px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600}
.steps .sum{font-weight:600;color:var(--accent)}
.steps .sum::before,.steps .nonum::before{content:none}
.steps .sum,.steps .nonum{counter-increment:none}
.card a{color:var(--accent)}
.routebar{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:28px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);box-sizing:border-box}
html[dir=rtl] .routebar{padding:6px 6px 6px 6px}
.routebar .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.routebar .dot svg{width:18px;height:18px}.routebar .dot.logo img{width:100%;height:100%;object-fit:cover}
.routebar .rb-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.routebar .rb-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routebar .rb-t small{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}
.routebar{min-width:220px}
.routebar .rb-x{border:0;background:var(--ground);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;margin-inline-start:6px}
.routebar .rb-x svg{width:14px;height:14px}
.toast{position:fixed;top:calc(156px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);text-align:center;box-sizing:border-box;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9}

@media (max-width:640px){
  .tab{display:none}
  .dock{width:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));transform:none;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .corner{width:44px;height:44px;font-size:9.5px;border-radius:9px;bottom:calc(152px + env(safe-area-inset-bottom,0px))}
  .corner svg{width:17px;height:17px}
  .card{top:auto;bottom:calc(206px + env(safe-area-inset-bottom,0px));width:auto;inset-inline-end:max(16px,env(safe-area-inset-left,0px));max-height:36vh;overflow:auto}
  .card .swatch{display:none}
  .card .hd{padding:10px 12px 6px}.card h2{font-size:15px}
  .card .acts{padding:0 12px 8px}.card dl{padding:0 12px 8px;font-size:12px}
  .steps{padding:8px 12px 10px;font-size:12px;gap:4px}
  .startp{bottom:calc(206px + env(safe-area-inset-bottom,0px))}
}
</style>

<canvas id="scene" aria-label="خريطة ثلاثية الأبعاد للمجمع"></canvas>
<div id="markers"></div>

<div class="brand"><b id="tBrand">المنطقة المركزية</b><small id="tCity">مدينة حائل</small><br><span class="demo" id="tDemo" hidden>بيانات تجريبية</span></div>
<div class="tab" id="tTab">17 محل</div>

<button class="tod" id="todBtn" aria-pressed="false" aria-label="نهار / ليل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>

<div class="card" id="card" hidden></div>

<div class="dock">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

    <button type="button" id="meBtn" class="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg><span id="tMe">موقعي</span></button>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="rail">
    <button class="arrow" id="prev" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="cats" id="cats"></div>

  </div>
</div>

<button class="corner" id="homeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg><span id="tHome">الرئيسية</span></button>
<button class="corner" id="langBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="tLang">English</span></button>

<script>
(function(){
const LAT=27.521321667160553, LNG=41.698167564076776;
const M_PER_U=1/0.9242606; // metres per model unit
const D=Math.PI/180;
const ICONS={
 fork:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>',
 cup:'<path d="M10 2v2M14 2v2M6 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>',
 shirt:'<path d="M8 3L3 6l2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
 gift:'<rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/>',
 icecream:'<path d="M7 11l4.08 10.35a1 1 0 0 0 1.84 0L17 11M17 7A5 5 0 0 0 7 7M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"/>',
 basket:'<path d="M15 11l-1 9M19 11l-4-7M2 11h20M3.5 11l1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4M4.5 15.5h15M5 11l4-7M9 11l1 9"/>',
 kids:'<circle cx="12" cy="5" r="2"/><path d="M12 7v7M8 10h8M9 21l3-7 3 7"/>',
 star:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
 bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
 mosque:'<path d="M12 2.5c-1 2-4 3.2-4 6.5h8c0-3.3-3-4.5-4-6.5zM6 9h12v12H6zM10 21v-5a2 2 0 0 1 4 0v5"/>',
 bed:'<path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.8"/>',
 gov:'<path d="M3 10l9-6 9 6M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 21h18"/>',
 parking:'<path d="M8 21V3h5a5 5 0 0 1 0 10H8"/>',

 route:'<path d="M5 19c4 0 4-14 8-14h6M15 2l4 3-4 3"/>'
};
const svg=(k,c='#fff',w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const CATS=[
 {id:'food',ar:'مطاعم',en:'Restaurants',c:'#c0683a',i:'fork'},
 {id:'cafe',ar:'كافيهات',en:'Cafés',c:'#86583a',i:'cup'},
 {id:'sweets',ar:'حلويات',en:'Sweets',c:'#c2477a',i:'icecream'},
 {id:'shop',ar:'متاجر',en:'Shops',c:'#7a4f94',i:'basket'},
 {id:'gifts',ar:'هدايا',en:'Gifts',c:'#3d6aa3',i:'gift'},
 {id:'kids',ar:'ألعاب أطفال',en:'Kids',c:'#d08a1f',i:'kids'},
 {id:'landmark',ar:'معالم',en:'Landmarks',c:'#2c8a7e',i:'star'},
 {id:'mall',ar:'مراكز تسوق',en:'Shopping',c:'#9a3f5c',i:'bag'},
 {id:'mosque',ar:'مساجد',en:'Mosques',c:'#2f7a55',i:'mosque'},
 {id:'hotel',ar:'فنادق',en:'Hotels',c:'#6a5a9e',i:'bed'},
 {id:'gov',ar:'جهات حكومية',en:'Government',c:'#5b6670',i:'gov'},
 {id:'parking',ar:'المواقف',en:'Parking',c:'#3b5a8a',i:'parking'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const dotHTML=(p,cls='dot')=>p.logo?`<span class="${cls} logo"><img src="${p.logo}" alt=""></span>`:`<span class="${cls}" style="background:${CAT[p.cat].c}">${svg(CAT[p.cat].i)}</span>`;

function autoLocate(){
  if(!navigator.geolocation||location.hash.indexOf('#from-')===0)return;
  try{navigator.geolocation.getCurrentPosition(pos=>{
    if(start)return;const q=geoToXZ(pos.coords.latitude,pos.coords.longitude);
    if(Math.hypot(q.x-60,q.z-30)>650)return;
    setStart(q,t('myGps'));
    try{geoWatch=navigator.geolocation.watchPosition(ps=>{const r=geoToXZ(ps.coords.latitude,ps.coords.longitude);
      if(start&&start.label===t('myGps')&&Math.hypot(r.x-60,r.z-30)<650&&Math.hypot(r.x-start.x,r.z-start.z)>3){start.x=here.x=r.x;start.z=here.z=r.z;if(selected&&routePts)renderCard(selected,true)}},()=>{},{enableHighAccuracy:true,maximumAge:5000})}catch(e){}
  },()=>{},{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}catch(e){}
}
setTimeout(autoLocate,600);
const catsEl=document.getElementById('cats');
function renderCats(){catsEl.innerHTML='';CATS.filter(c=>places.some(p=>p.cat===c.id)).forEach(c=>{const b=document.createElement('button');b.className='cat';b.type='button';b.setAttribute('aria-pressed',String(activeCat===c.id));
  b.innerHTML=`<span class="dot" style="background:${c.c}">${svg(c.i)}</span><span>${cname(c)}</span>`;b.onclick=()=>setCat(activeCat===c.id?null:c.id);catsEl.appendChild(b)})}
function setCat(id){
  activeCat=id;renderCats();places.forEach(p=>p.el.classList.toggle('dim',!!id&&p.cat!==id));
  if(!id){goHome();return}
  const ps=places.filter(p=>p.cat===id);if(ps.length===1){select(ps[0]);return}
  closeCard();let x1=1e9,x2=-1e9,z1=1e9,z2=-1e9;ps.forEach(q=>{x1=Math.min(x1,q.x);x2=Math.max(x2,q.x);z1=Math.min(z1,q.z);z2=Math.max(z2,q.z)});
  const cx=(x1+x2)/2,cz=(z1+z2)/2,span=Math.max(x2-x1,z2-z1)+80;flyTo(new THREE.Vector3(cx+span*.3,span*.9+30,cz+span),new THREE.Vector3(cx,0,cz));
}
const dirSign=()=>lang==='ar'?1:-1;
document.getElementById('prev').onclick=()=>catsEl.scrollBy({left:200*dirSign()});
document.getElementById('next').onclick=()=>catsEl.scrollBy({left:-200*dirSign()});
const q=document.getElementById('q'),res=document.getElementById('results');
const norm=s=>String(s).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function doSearch(){
  const s=norm(q.value.trim());if(!s){res.hidden=true;return}
  const hits=places.filter(p=>norm(p.ar+' '+p.en+' '+CAT[p.cat].ar+' '+CAT[p.cat].en+' '+(p.n||'')).includes(s)).slice(0,10);
  res.innerHTML=hits.length?'':`<div style="padding:10px;color:var(--muted);font-size:13px">${t('nores')}</div>`;
  hits.forEach(p=>{const b=document.createElement('button');b.type='button';
    b.innerHTML=`${dotHTML(p)}<span>${pname(p)}<small>${cname(CAT[p.cat])}</small></span>`;
    b.onclick=()=>{res.hidden=true;q.value='';q.blur();activeCat=null;renderCats();places.forEach(o=>o.el.classList.remove('dim'));select(p)};res.appendChild(b)});
  res.hidden=false;
}
q.addEventListener('input',doSearch);q.addEventListener('focus',doSearch);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=res.querySelector('button');if(b)b.click()}if(e.key==='Escape')res.hidden=true});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))res.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeStartPanel();if(tapMode){tapMode=false;document.getElementById('toast').hidden=true}}});
function goHome(){closeCard();flyTo(HOME_POS.clone(),HOME_T.clone())}
document.getElementById('homeBtn').onclick=()=>setCat(null);
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  ['brand','city','demo','tab','home','lang'].forEach(k=>{const el=document.getElementById('t'+k[0].toUpperCase()+k.slice(1));if(el)el.textContent=t(k)});
  q.placeholder=t('search');document.getElementById('tMe').textContent=start?t('meSet'):t('me');q.setAttribute('aria-label',t('search'));renderCats();labelAll();
  if(selected)renderCard(selected,!!routePts);updateClock();
}
document.getElementById('todBtn').onclick=()=>setTime(!night);
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';applyLang()};
function updateClock(){try{document.getElementById('clock').textContent=new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}).format(new Date())}catch(e){}}
setInterval(updateClock,20000);
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-Y),hitPt=new THREE.Vector3();
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const rc=canvas.getBoundingClientRect();mp.set((e.clientX-rc.left)/rc.width*2-1,-((e.clientY-rc.top)/rc.height)*2+1);ray.setFromCamera(mp,camera);
  if(tapMode){if(ray.ray.intersectPlane(groundPlane,hitPt)){document.getElementById('toast').hidden=true;setStart({x:hitPt.x,z:hitPt.z},t('mapPoint'))}return}
  const hit=ray.intersectObjects(pickables)[0];if(hit)select(hit.object.userData.place)});
controls.addEventListener('start',()=>{flight=null});
function resize(){const w=Math.max(1,canvas.clientWidth||innerWidth),h=Math.max(1,canvas.clientHeight||innerHeight);if(renderer._w===w&&renderer._h===h)return;renderer._w=w;renderer._h=h;renderer.setSize(w,h,false);camera.aspect=w/h;
  // shift the picture up so the plaza sits above the search bar
  applyOffset()}
function applyOffset(){
  const w=renderer._w||innerWidth,h=renderer._h||innerHeight;
  const dock=document.querySelector('.dock');let topEdge=dock?dock.getBoundingClientRect().top:h-180;
  const cd=document.getElementById('card');
  if(cd&&!cd.hidden&&w<=640){topEdge=Math.min(topEdge,cd.getBoundingClientRect().top)}
  camera.setViewOffset(w,h,0,Math.round(Math.max(0,(h-topEdge)*.5)),w,h);camera.updateProjectionMatrix();wake()}
try{new ResizeObserver(resize).observe(canvas)}catch(e){}
addEventListener('resize',resize);resize();
function openHash(){const id=location.hash.slice(1);if(id.indexOf('from-')===0){const k=id.slice(5);if(k==='gate'){setStart({x:HERE.x,z:HERE.z},t('gate'));return}const q=byId(k);if(q)setStart(q.door||q,pname(q));return}const p=places.find(o=>o.id===id);if(p)select(p,true)}
addEventListener('hashchange',openHash);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.addEventListener('change',wake);
['pointerdown','pointermove','wheel','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));
addEventListener('resize',wake);
let lastWater=0;
function loop(now){
  if(flight){const f=reduce?1:Math.min(1,(now-flight.start)/flight.ms),e=ease(f);camera.position.lerpVectors(flight.p0,flight.p1,e);controls.target.lerpVectors(flight.t0,flight.t1,e);if(f>=1)flight=null}
  controls.update();
  if(flight||(routePts&&chevrons.length))needs=Math.max(needs,1);
  if(!isMobile&&now-lastWater>100){lastWater=now;waterTexs.forEach((w,i)=>{w.offset.x=(now/1000)*.012*(i%2?1:-1);w.offset.y=(now/1000)*.006});needs=Math.max(needs,1)}
  if(needs<=0){requestAnimationFrame(loop);return}
  needs--;
  if(routePts&&chevrons.length){const off=reduce?0:(now/1000*6)%5;chevrons.forEach((c,i)=>{const r=pointAt(Math.min(routeLen,i*5+off));c.position.set(r.p.x,r.p.y+.05,r.p.z);c.rotation.y=r.dir})}
  renderer.render(scene,camera);placeMarkers();requestAnimationFrame(loop);
}
applyLang();openHash();requestAnimationFrame(loop);
})();
</script>
</body></html>
